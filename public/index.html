<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>إلفير - اتصال هاتفي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #ffffff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px; overflow: hidden; }
        
        /* حالة الاتصال والعداد */
        .header { text-align: center; margin-top: 20px; }
        .agent-name { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
        .call-status { font-size: 16px; color: #94a3b8; font-weight: 500; }
        
        /* صورة إلفير والموجات */
        .avatar-container { position: relative; display: flex; justify-content: center; align-items: center; margin: my auto; }
        .avatar { width: 140px; height: 140px; border-radius: 50%; background: #1e293b; border: 3px solid #3b82f6; display: flex; justify-content: center; align-items: center; font-size: 48px; z-index: 2; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .pulse-ring { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(59, 130, 246, 0.2); z-index: 1; animation: pulse 2s infinite ease-in-out; }
        .speaking .pulse-ring { animation: pulse-active 0.8s infinite ease-in-out; background: rgba(34, 197, 94, 0.3); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes pulse-active {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* أزرار التحكم بالاتصال */
        .controls { display: flex; gap: 24px; align-items: center; margin-bottom: 20px; }
        .btn { width: 64px; height: 64px; border-radius: 50%; border: none; outline: none; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 22px; transition: all 0.2s ease; }
        .btn-secondary { background: #334155; color: #f8fafc; }
        .btn-secondary.active { background: #f8fafc; color: #0f172a; }
        .btn-danger { background: #ef4444; color: #ffffff; width: 72px; height: 72px; font-size: 26px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .btn:active { transform: scale(0.92); }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="agent-name">إلفير</h1>
        <p class="call-status" id="status">جاري الاتصال...</p>
    </div>

    <div class="avatar-container" id="avatarBox">
        <div class="pulse-ring"></div>
        <div class="avatar">🎙️</div>
    </div>

    <div class="controls">
        <!-- زر الكتم -->
        <button class="btn btn-secondary" id="muteBtn" onclick="toggleMute()">🔇</button>
        
        <!-- زر إنهاء المكالمة -->
        <button class="btn btn-danger" onclick="endCall()">📞</button>
        
        <!-- زر السبيكر -->
        <button class="btn btn-secondary" id="speakerBtn" onclick="toggleSpeaker()">🔊</button>
    </div>

    <script>
        // تهيئة Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let seconds = 0;
        let timerInterval = null;
        let isMuted = false;
        let isSpeaker = true;

        // محاكاة بدء الاتصال وبدء العداد
        setTimeout(() => {
            document.getElementById('status').innerText = '00:00';
            startTimer();
        }, 1500);

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                document.getElementById('status').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('muteBtn');
            btn.classList.toggle('active', isMuted);
            btn.innerText = isMuted ? '🎙️' : '🔇';
        }

        function toggleSpeaker() {
            isSpeaker = !isSpeaker;
            const btn = document.getElementById('speakerBtn');
            btn.classList.toggle('active', !isSpeaker);
        }

        function endCall() {
            clearInterval(timerInterval);
            document.getElementById('status').innerText = 'تم إنهاء المكالمة';
            setTimeout(() => {
                if(tg) tg.close();
            }, 800);
        }
    </script>
</body>
</html>
