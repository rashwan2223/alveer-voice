<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>إلفير — مكالمة صوتية</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --ring-scale-1: 1;
    --ring-scale-2: 1;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Tahoma", "Arial", sans-serif;
    user-select:none;
  }

  body{
    background: linear-gradient(135deg, #6a70da 0%, #5f8fe4 40%, #4fa8e6 70%, #48c2ea 100%);
    height: 100vh;
    width: 100vw;
    position: relative;
    color: #fff;
  }

  .call-screen{
    position:relative;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    justify-content: space-between;
    padding-top: calc(var(--safe-top) + 16px);
    padding-bottom: calc(var(--safe-bottom) + 30px);
    transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .35s ease;
  }

  /* ---------- top bar ---------- */
  .top-bar{
    display:flex; align-items:center;
    padding: 0 20px;
    height: 30px;
    flex-shrink:0;
  }

  .minimize-btn{
    width: 30px; height: 30px;
    border:none;
    background: transparent;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    cursor:pointer;
    padding:0;
  }
  .minimize-btn:active{ opacity:.6; }
  .minimize-btn svg{ width:22px; height:22px; }

  /* ---------- center / avatar section ---------- */
  .avatar-section{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top: 12%;
    min-height:0;
  }

  .visualizer-wrap{
    position:relative;
    width: 176px; height: 176px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 26px;
  }

  .vring{
    position:absolute;
    border-radius:50%;
    border: 1px solid rgba(255,255,255,0.28);
    pointer-events:none;
  }
  .vring-1{ width:150px; height:150px; transform: scale(var(--ring-scale-1)); transition: transform .09s linear; opacity:.55; }
  .vring-2{ width:170px; height:170px; transform: scale(var(--ring-scale-2)); transition: transform .12s linear; opacity:.3; }

  .avatar-circle{
    position:relative;
    width: 132px; height: 132px;
    border-radius:50%;
    background: linear-gradient(145deg, #c6a9f0 0%, #9b7bd6 40%, #7859c9 100%);
    display:flex; align-items:center; justify-content:center;
    font-size: 50px;
    font-weight:600;
    color:#fff;
    box-shadow: 0 8px 22px rgba(40,10,90,0.28);
    z-index:2;
  }

  .assistant-name{
    font-size: 27px;
    font-weight: 600;
    letter-spacing: .2px;
    margin-top: 2px;
  }

  .call-status{
    margin-top: 9px;
    font-size: 15.5px;
    color: rgba(255,255,255,0.85);
    min-height: 20px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- bottom bar ---------- */
  .bottom-bar{
    direction: ltr;
    display:flex;
    align-items:flex-start;
    justify-content: space-between;
    padding: 0 34px;
    flex-shrink:0;
  }

  .btn-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
  }

  .btn-label{
    font-size: 12.5px;
    color: rgba(255,255,255,0.92);
    white-space:nowrap;
  }

  .call-btn{
    border:none;
    border-radius:50%;
    width: 66px; height: 66px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  .call-btn:active{ transform: scale(.9); }

  .btn-secondary{
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color:#fff;
  }
  .btn-secondary.active{
    background: #ffffff;
    color: #2b2b2b;
  }
  .btn-secondary svg{ width:26px; height:26px; }

  .btn-end{
    background: #ef3b3b;
    box-shadow: 0 6px 16px rgba(180,20,20,0.4);
  }
  .btn-end svg{ width:28px; height:28px; }

  /* ---------- minimized state ---------- */
  .call-screen.minimized .avatar-section,
  .call-screen.minimized .top-bar,
  .call-screen.minimized .bottom-bar{
    opacity:0;
    pointer-events:none;
  }
  .call-screen.minimized .mini-pill{
    opacity:1;
    pointer-events:auto;
  }

  .mini-pill{
    position:absolute;
    top: calc(var(--safe-top) + 14px);
    left: 16px;
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(20,10,40,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 8px 14px 8px 8px;
    opacity:0;
    pointer-events:none;
    transition: opacity .3s ease;
    cursor:pointer;
    z-index:5;
  }
  .mini-pill .mini-avatar{
    width: 30px; height:30px; border-radius:50%;
    background: linear-gradient(145deg, #c6a9f0 0%, #9b7bd6 40%, #7859c9 100%);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600;
  }
  .mini-pill .mini-text{
    font-size:13px;
    font-variant-numeric: tabular-nums;
    color:#fff;
  }
</style>
</head>
<body>

  <div class="call-screen" id="callScreen">

    <!-- top bar -->
    <div class="top-bar">
      <button class="minimize-btn" id="minimizeBtn" aria-label="تصغير">
        <svg id="minimizeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 16 4 20 8 20"></polyline>
          <line x1="4" y1="20" x2="10" y2="14"></line>
          <polyline points="20 8 20 4 16 4"></polyline>
          <line x1="20" y1="4" x2="14" y2="10"></line>
        </svg>
      </button>
    </div>

    <!-- center avatar / visualizer -->
    <div class="avatar-section">
      <div class="visualizer-wrap">
        <div class="vring vring-2"></div>
        <div class="vring vring-1"></div>
        <div class="avatar-circle" id="avatarCircle">إ</div>
      </div>
      <div class="assistant-name">إلفير</div>
      <div class="call-status" id="statusText">يتم الطلب<span id="dots">.</span></div>
    </div>

    <!-- bottom controls -->
    <div class="bottom-bar">
      <div class="btn-col">
        <button class="call-btn btn-secondary active" id="speakerBtn" aria-label="مكبر الصوت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
          </svg>
        </button>
        <div class="btn-label">مكبر الصوت</div>
      </div>

      <div class="btn-col">
        <button class="call-btn btn-secondary active" id="cameraBtn" aria-label="تشغيل الكاميرا">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 16v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2"></path>
            <path d="M9 5h5a2 2 0 0 1 2 2v5"></path>
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
        <div class="btn-label">تشغيل الكاميرا</div>
      </div>

      <div class="btn-col">
        <button class="call-btn btn-secondary" id="muteBtn" aria-label="كتم">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <div class="btn-label">كتم</div>
      </div>

      <div class="btn-col">
        <button class="call-btn btn-end" id="endBtn" aria-label="إنهاء المكالمة">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 9c-2.5 0-4.8.5-6.9 1.4a1.5 1.5 0 0 0-.9 1.6l.3 2a1.5 1.5 0 0 0 1.2 1.3c1 .2 2 .3 2.7.3.5 0 .9-.3 1.1-.7l.5-1.1c.2-.4.6-.6 1-.5 1 .2 2 .2 3 0 .4-.1.8.1 1 .5l.5 1.1c.2.4.6.7 1.1.7.7 0 1.7-.1 2.7-.3a1.5 1.5 0 0 0 1.2-1.3l.3-2a1.5 1.5 0 0 0-.9-1.6A17.6 17.6 0 0 0 12 9z" transform="rotate(135 12 12)"></path>
          </svg>
        </button>
        <div class="btn-label">إنهاء</div>
      </div>
    </div>

    <!-- minimized pill -->
    <div class="mini-pill" id="miniPill">
      <div class="mini-avatar">إ</div>
      <div class="mini-text" id="miniTimer">00:00</div>
    </div>

  </div>

<script>
(function(){
  "use strict";

  /* ---------------- Telegram WebApp bootstrap ---------------- */
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation && tg.enableClosingConfirmation();
      if (tg.setHeaderColor) { try { tg.setHeaderColor('#5f8fe4'); } catch(e){} }
      if (tg.setBackgroundColor) { try { tg.setBackgroundColor('#48c2ea'); } catch(e){} }
    } catch(e) { /* running outside Telegram, ignore */ }
  }

  function getChatId(){
    try {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        return String(tg.initDataUnsafe.user.id);
      }
    } catch(e){}
    return "unknown";
  }
  var CHAT_ID = getChatId();
  var AUDIO_ENDPOINT = "/api/audio";

  /* ---------------- DOM refs ---------------- */
  var callScreen   = document.getElementById('callScreen');
  var statusText   = document.getElementById('statusText');
  var dotsEl       = document.getElementById('dots');
  var minimizeBtn  = document.getElementById('minimizeBtn');
  var miniPill     = document.getElementById('miniPill');
  var miniTimer    = document.getElementById('miniTimer');
  var muteBtn      = document.getElementById('muteBtn');
  var speakerBtn   = document.getElementById('speakerBtn');
  var cameraBtn    = document.getElementById('cameraBtn');
  var endBtn       = document.getElementById('endBtn');

  /* ---------------- state ---------------- */
  var state = {
    isMuted: false,
    isSpeakerOn: true,
    isCameraOn: false,
    isMinimized: false,
    isSpeaking: false,
    callActive: false,
    callConnected: false,
    callStartTs: null,
    timerInterval: null,
    dotsInterval: null
  };

  var mediaStream = null;
  var audioContext = null;
  var analyser = null;
  var sourceNode = null;
  var freqData = null;
  var rafId = null;

  var mediaRecorder = null;
  var recordedChunks = [];
  var isRecordingSegment = false;
  var silenceStart = null;

  var SPEECH_THRESHOLD = 0.045;   // RMS threshold to consider "speaking"
  var SILENCE_HOLD_MS = 900;      // how long silence must persist before we flush the segment
  var MAX_SEGMENT_MS = 15000;     // hard cap per segment so audio isn't held forever
  var segmentStartedAt = null;

  /* ---------------- dialing dots ---------------- */
  function startDialingDots(){
    var n = 1;
    state.dotsInterval = setInterval(function(){
      n = (n % 3) + 1;
      dotsEl.textContent = ".".repeat(n);
    }, 480);
  }
  function stopDialingDots(){
    if (state.dotsInterval) { clearInterval(state.dotsInterval); state.dotsInterval = null; }
  }

  /* ---------------- timer ---------------- */
  function formatTime(ms){
    var totalSec = Math.floor(ms / 1000);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function startTimer(){
    state.callStartTs = Date.now();
    state.timerInterval = setInterval(function(){
      var elapsed = Date.now() - state.callStartTs;
      var t = formatTime(elapsed);
      miniTimer.textContent = t;
      if (!state.isSpeaking) {
        statusText.textContent = t;
      }
    }, 1000);
  }

  function stopTimer(){
    if (state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }

  function setSpeakingUI(speaking){
    if (state.isSpeaking === speaking) return;
    state.isSpeaking = speaking;
    if (speaking) {
      statusText.textContent = "يتحدث...";
    } else {
      var elapsed = state.callStartTs ? Date.now() - state.callStartTs : 0;
      statusText.textContent = formatTime(elapsed);
    }
  }

  /* ---------------- visualizer + VAD loop ---------------- */
  function rms(data){
    var sum = 0;
    for (var i = 0; i < data.length; i++) {
      var v = (data[i] - 128) / 128;
      sum += v * v;
    }
    return Math.sqrt(sum / data.length);
  }

  function visualizerLoop(){
    rafId = requestAnimationFrame(visualizerLoop);
    if (!analyser) return;

    analyser.getByteTimeDomainData(freqData);
    var level = rms(freqData); // 0..~1

    var clamped = Math.min(level * 6, 1); // amplify for visible motion
    var s1 = 1 + clamped * 0.22;
    var s2 = 1 + clamped * 0.4;

    callScreen.style.setProperty('--ring-scale-1', s1.toFixed(3));
    callScreen.style.setProperty('--ring-scale-2', s2.toFixed(3));

    handleVAD(level);
  }

  function handleVAD(level){
    if (state.isMuted || !state.callActive) return;
    var now = Date.now();
    var speaking = level > SPEECH_THRESHOLD;

    if (speaking) {
      silenceStart = null;
      setSpeakingUI(true);
      if (!isRecordingSegment) {
        startRecordingSegment();
      } else if (segmentStartedAt && (now - segmentStartedAt) > MAX_SEGMENT_MS) {
        flushSegment();
        startRecordingSegment();
      }
    } else {
      if (isRecordingSegment) {
        if (silenceStart === null) {
          silenceStart = now;
        } else if (now - silenceStart >= SILENCE_HOLD_MS) {
          flushSegment();
          silenceStart = null;
          setSpeakingUI(false);
        }
      } else {
        setSpeakingUI(false);
      }
    }
  }

  /* ---------------- recording segments ---------------- */
  function pickMimeType(){
    var candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus',
      'audio/mp4'
    ];
    for (var i = 0; i < candidates.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) {
        return candidates[i];
      }
    }
    return '';
  }
  var MIME_TYPE = pickMimeType();

  function startRecordingSegment(){
    if (!mediaStream || isRecordingSegment) return;
    try {
      recordedChunks = [];
      var opts = MIME_TYPE ? { mimeType: MIME_TYPE } : undefined;
      mediaRecorder = new MediaRecorder(mediaStream, opts);
      mediaRecorder.ondataavailable = function(e){
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = function(){
        if (recordedChunks.length > 0) {
          var blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || MIME_TYPE || 'audio/webm' });
          recordedChunks = [];
          if (blob.size > 800) { // ignore near-empty noise blips
            sendAudioSegment(blob);
          }
        }
      };
      mediaRecorder.start();
      isRecordingSegment = true;
      segmentStartedAt = Date.now();
    } catch(err){
      console.error('MediaRecorder start failed:', err);
      isRecordingSegment = false;
    }
  }

  function flushSegment(){
    if (mediaRecorder && isRecordingSegment) {
      try { mediaRecorder.stop(); } catch(e){}
    }
    isRecordingSegment = false;
    segmentStartedAt = null;
  }

  function sendAudioSegment(blob){
    var ext = (blob.type && blob.type.indexOf('ogg') !== -1) ? 'ogg' :
              (blob.type && blob.type.indexOf('mp4') !== -1) ? 'm4a' : 'webm';
    var fd = new FormData();
    fd.append('audio', blob, 'segment_' + Date.now() + '.' + ext);
    fd.append('chat_id', CHAT_ID);

    statusText.textContent = "إلفير يجيب...";

    fetch(AUDIO_ENDPOINT, {
      method: 'POST',
      body: fd
    }).then(function(res){
      if (!res.ok) {
        console.warn('Audio upload responded with status', res.status);
        return;
      }
      return res.blob();
    }).then(function(audioBlob){
      if (audioBlob && audioBlob.size > 0) {
        var audioUrl = URL.createObjectURL(audioBlob);
        var player = new Audio(audioUrl);
        
        player.onended = function() {
          var elapsed = state.callStartTs ? Date.now() - state.callStartTs : 0;
          statusText.textContent = formatTime(elapsed);
        };

        player.play().catch(function(e){
          console.error("Audio playback error:", e);
        });
      }
    }).catch(function(err){
      console.error('Audio upload failed:', err);
    });
  }

  /* ---------------- call lifecycle ---------------- */
  function startCall(){
    startDialingDots();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      stopDialingDots();
      statusText.textContent = "المتصفح لا يدعم الميكروفون";
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }})
      .then(function(stream){
        mediaStream = stream;
        state.callActive = true;
        state.callConnected = true;

        var AC = window.AudioContext || window.webkitAudioContext;
        audioContext = new AC();
        sourceNode = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.6;
        freqData = new Uint8Array(analyser.fftSize);
        sourceNode.connect(analyser);

        stopDialingDots();
        startTimer();
        statusText.textContent = "00:00";
        visualizerLoop();

        if (tg && tg.HapticFeedback) {
          try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
        }
      })
      .catch(function(err){
        console.error('getUserMedia error:', err);
        stopDialingDots();
        statusText.textContent = "تعذّر الوصول إلى الميكروفون";
      });
  }

  function endCall(){
    state.callActive = false;

    flushSegment();
    stopDialingDots();

    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    stopTimer();

    if (mediaStream) {
      mediaStream.getTracks().forEach(function(t){ t.stop(); });
      mediaStream = null;
    }
    if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} sourceNode = null; }
    if (analyser) { try { analyser.disconnect(); } catch(e){} analyser = null; }
    if (audioContext) {
      try { audioContext.close(); } catch(e){}
      audioContext = null;
    }

    statusText.textContent = "انتهت المكالمة";

    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.notificationOccurred('warning'); } catch(e){}
    }

    setTimeout(function(){
      if (tg && tg.close) {
        try { tg.close(); return; } catch(e){}
      }
      window.close();
    }, 250);
  }

  /* ---------------- UI controls ---------------- */
  function toggleMute(){
    state.isMuted = !state.isMuted;
    if (mediaStream) {
      mediaStream.getAudioTracks().forEach(function(t){ t.enabled = !state.isMuted; });
    }
    if (state.isMuted) {
      flushSegment();
      muteBtn.classList.add('active');
      statusText.textContent = "الميكروفون مكتوم";
    } else {
      muteBtn.classList.remove('active');
    }
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('rigid'); } catch(e){}
    }
  }

  function toggleSpeaker(){
    state.isSpeakerOn = !state.isSpeakerOn;
    speakerBtn.classList.toggle('active', state.isSpeakerOn);
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
    }
  }

  function toggleCamera(){
    state.isCameraOn = !state.isCameraOn;
    cameraBtn.classList.toggle('active', !state.isCameraOn);
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
    }
  }

  function toggleMinimize(){
    state.isMinimized = !state.isMinimized;
    callScreen.classList.toggle('minimized', state.isMinimized);
    var icon = document.getElementById('minimizeIcon');
    icon.innerHTML = state.isMinimized
      ? '<polyline points="4 8 4 4 8 4"></polyline><line x1="4" y1="4" x2="10" y2="10"></line><polyline points="20 16 20 20 16 20"></polyline><line x1="20" y1="20" x2="14" y2="14"></line>'
      : '<polyline points="4 16 4 20 8 20"></polyline><line x1="4" y1="20" x2="10" y2="14"></line><polyline points="20 8 20 4 16 4"></polyline><line x1="20" y1="4" x2="14" y2="10"></line>';
  }

  minimizeBtn.addEventListener('click', toggleMinimize);
  miniPill.addEventListener('click', toggleMinimize);
  muteBtn.addEventListener('click', toggleMute);
  speakerBtn.addEventListener('click', toggleSpeaker);
  cameraBtn.addEventListener('click', toggleCamera);
  endBtn.addEventListener('click', endCall);

  window.addEventListener('beforeunload', function(){
    if (mediaStream) mediaStream.getTracks().forEach(function(t){ t.stop(); });
  });

  /* ---------------- auto-start the call ---------------- */
  startCall();

})();
</script>
</body>
</html>
