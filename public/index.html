<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلفير - مساعد صوتي</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .mic-btn { width: 100px; height: 100px; border-radius: 50%; border: none; background: #2563eb; color: #fff; font-size: 32px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(37, 99, 235, 0.5); }
    .mic-btn.recording { background: #dc2626; box-shadow: 0 0 25px rgba(220, 38, 38, 0.8); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    #status { margin-top: 20px; font-size: 16px; color: #94a3b8; }
  </style>
</head>
<body>
  <h2>المساعد الصوتي إلفير</h2>
  <button id="micBtn" class="mic-btn">🎙️</button>
  <div id="status">اضغط للمحادثة</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    let mediaRecorder, audioChunks = [];

    micBtn.onclick = async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        micBtn.classList.remove('recording');
        status.innerText = "جاري إرسال الصوت...";
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const formData = new FormData();
            formData.append('audio', audioBlob);
            formData.append('chat_id', tg?.initDataUnsafe?.user?.id || 'web');

            try {
              const res = await fetch('/api/audio', { method: 'POST', body: formData });
              status.innerText = res.ok ? "تم الرد بنجاح!" : "حدث خطأ بالاتصال";
            } catch (err) { status.innerText = "فشل الإرسال للسيرفر"; }
          };
          mediaRecorder.start();
          micBtn.classList.add('recording');
          status.innerText = "جاري الاستماع... اضغط لإكمال الرسالة";
        } catch (err) { status.innerText = "يرجى تفعيل إذن المايكروفون"; }
      }
    };
  </script>
</body>
</html>
